name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
env:
  PYTHONUNBUFFERED: '1'
jobs:
  distribution-core:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Check lint, distributions, and the installed core wheel
        run: python tools/check.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: distributions
          path: dist/
          if-no-files-found: error
  linux-harbor:
    needs: distribution-core
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: distributions
          path: ${{ runner.temp }}/wheels
      - name: Install namespace tools and pinned Nix
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap uidmap python3.12 curl xz-utils
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          sudo usermod --add-subuids 1000000-1065535 --add-subgids 1000000-1065535 "$(id -un)"
          sudo mkdir -p /nix
          sudo chown "$(id -u):$(id -g)" /nix
          sh tools/install-nix.sh
      - name: Install the wheel with stock Harbor
        run: |
          python -m venv "$RUNNER_TEMP/plugin-harbor"
          wheels=("$RUNNER_TEMP"/wheels/*.whl)
          test "${#wheels[@]}" -eq 1
          "$RUNNER_TEMP/plugin-harbor/bin/python" -m pip install "${wheels[0]}[harbor,test]"
          "$RUNNER_TEMP/plugin-harbor/bin/python" -m pip check
          cp -R tests "$RUNNER_TEMP/plugin-harbor-tests"
      - name: Test stock Harbor and all four example tasks
        working-directory: ${{ runner.temp }}
        env:
          HELL_TEST_NAMESPACES: '1'
        run: |
          . "$HOME/.nix-profile/etc/profile.d/nix.sh"
          "$RUNNER_TEMP/plugin-harbor/bin/python" -I - <<'PY'
          import os
          from pathlib import Path

          import harbor_bubblewrap.environment

          assert not Path(harbor_bubblewrap.environment.__file__).resolve().is_relative_to(Path(os.environ["GITHUB_WORKSPACE"]))
          PY
          "$RUNNER_TEMP/plugin-harbor/bin/python" -I -m pytest -q "$RUNNER_TEMP/plugin-harbor-tests"
