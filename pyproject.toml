[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "harbor-bubblewrap"
version = "0.1.3"
description = "Harbor environments with bubblewrap and Nix"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "2nd Set AI Corp."}]
requires-python = ">=3.12"
dependencies = ["PyYAML>=6,<7"]
keywords = ["harbor", "bubblewrap", "nix", "sandbox"]
classifiers = [
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Testing",
]

[project.urls]
Source = "https://github.com/Chelis-Lang/harbor-bubblewrap"
Issues = "https://github.com/Chelis-Lang/harbor-bubblewrap/issues"
Documentation = "https://github.com/Chelis-Lang/harbor-bubblewrap#readme"

[project.optional-dependencies]
harbor = ["harbor==0.24.0", "dockerfile-parse==2.0.1"]
test = ["pytest==8.4.2"]
dev = ["build==1.3.0", "ruff==0.16.10", "twine==6.2.0"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["harbor_bubblewrap"]
namespaces = false

[tool.setuptools.package-data]
harbor_bubblewrap = ["tasks/**/*", "probe/*.nix"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
